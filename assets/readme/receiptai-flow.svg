<svg width="1100" height="430" viewBox="0 0 1100 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ReceiptAI system flow</title>
  <desc id="desc">Animated diagram showing a receipt moving through scan, storage, retrieval, and evidence-gated agent answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B13"/>
      <stop offset="0.48" stop-color="#111827"/>
      <stop offset="1" stop-color="#10101F"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="70" x2="980" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ECDC4"/>
      <stop offset="0.52" stop-color="#7C6AFF"/>
      <stop offset="1" stop-color="#FF5C8A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.49 0 0 0 0 0.42 0 0 0 0 1 0 0 0 0.8 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <style>
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #F8FAFC; }
      .sub { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #A7B0C2; }
      .tiny { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #6EE7D8; letter-spacing: 1px; }
      .card { fill: rgba(255,255,255,0.055); stroke: rgba(255,255,255,0.16); stroke-width: 1.3; }
      .line { stroke: url(#accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 9 18; animation: dash 1.7s linear infinite; }
      .pulse { transform-origin: center; animation: pulse 2.2s ease-in-out infinite; }
      .float { animation: float 3.4s ease-in-out infinite; }
      .float2 { animation: float 3.4s ease-in-out infinite; animation-delay: -1.2s; }
      .scan { animation: scan 2.4s ease-in-out infinite; }
      .spark { opacity: 0; animation: sparkle 2.6s ease-in-out infinite; }
      .spark:nth-of-type(2) { animation-delay: .35s; }
      .spark:nth-of-type(3) { animation-delay: .75s; }
      @keyframes dash { to { stroke-dashoffset: -54; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes scan { 0%, 100% { transform: translateY(-38px); opacity: .15; } 50% { transform: translateY(38px); opacity: .95; } }
      @keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(.7); } 45%, 65% { opacity: 1; transform: scale(1.15); } }
    </style>
  </defs>

  <rect width="1100" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="142" cy="68" r="115" fill="#4ECDC4" opacity="0.09"/>
  <circle cx="947" cy="368" r="155" fill="#7C6AFF" opacity="0.12"/>
  <circle cx="560" cy="215" r="190" stroke="url(#accent)" stroke-opacity="0.13" stroke-width="2"/>

  <text x="60" y="72" class="tiny">RECEIPTAI FLOW</text>
  <text x="60" y="112" style="font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 38px; font-weight: 900; fill: #FFFFFF;">Scan receipts. Ask questions. Trust evidence.</text>
  <text x="62" y="145" class="sub">A mobile receipt scanner backed by structured retrieval and an evidence-gated AI shopping agent.</text>

  <path class="line" d="M230 250 C310 205 380 205 460 250 S610 295 690 250 S840 205 920 250"/>

  <g class="float">
    <rect class="card" x="74" y="190" width="190" height="136" rx="22"/>
    <rect x="103" y="218" width="70" height="90" rx="9" fill="#F8FAFC"/>
    <path d="M117 240H160M117 258H153M117 276H163M117 294H144" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
    <rect class="scan" x="96" y="258" width="84" height="5" rx="2.5" fill="#4ECDC4" filter="url(#glow)"/>
    <text x="194" y="246" class="label">Scan</text>
    <text x="194" y="273" class="sub">image or PDF</text>
  </g>

  <g class="float2">
    <rect class="card" x="330" y="190" width="190" height="136" rx="22"/>
    <rect x="365" y="224" width="36" height="36" rx="9" fill="#7C6AFF" opacity=".92"/>
    <rect x="411" y="224" width="70" height="10" rx="5" fill="#CBD5E1" opacity=".7"/>
    <rect x="411" y="244" width="55" height="10" rx="5" fill="#64748B" opacity=".8"/>
    <rect x="365" y="275" width="116" height="13" rx="6.5" fill="#4ECDC4" opacity=".75"/>
    <text x="365" y="313" class="sub">Supabase memory</text>
    <text x="365" y="210" class="label">Store</text>
  </g>

  <g class="float">
    <rect class="card" x="586" y="190" width="190" height="136" rx="22"/>
    <circle cx="643" cy="252" r="30" fill="#111827" stroke="#7C6AFF" stroke-width="4"/>
    <path d="M661 271L687 297" stroke="#7C6AFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="643" cy="252" r="12" fill="#4ECDC4"/>
    <text x="688" y="245" class="label">Retrieve</text>
    <text x="688" y="272" class="sub">matched items</text>
  </g>

  <g class="float2">
    <rect class="card" x="842" y="190" width="190" height="136" rx="22"/>
    <path d="M910 222L923 248L951 254L929 273L934 302L910 288L885 302L891 273L868 254L897 248L910 222Z" fill="#7C6AFF"/>
    <circle class="spark" cx="965" cy="232" r="5" fill="#4ECDC4"/>
    <circle class="spark" cx="975" cy="270" r="4" fill="#FF5C8A"/>
    <circle class="spark" cx="870" cy="292" r="4" fill="#FACC15"/>
    <text x="946" y="247" class="label">Answer</text>
    <text x="946" y="274" class="sub">with evidence</text>
  </g>

  <circle class="pulse" cx="230" cy="250" r="9" fill="#4ECDC4" filter="url(#glow)"/>
  <circle class="pulse" cx="460" cy="250" r="9" fill="#7C6AFF" filter="url(#glow)"/>
  <circle class="pulse" cx="690" cy="250" r="9" fill="#7C6AFF" filter="url(#glow)"/>
  <circle class="pulse" cx="920" cy="250" r="9" fill="#FF5C8A" filter="url(#glow)"/>

  <rect x="326" y="356" width="448" height="40" rx="20" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
  <text x="365" y="381" class="sub">No receipt evidence -> no purchase claim</text>
  <circle cx="348" cy="376" r="7" fill="#4ECDC4"/>
</svg>
